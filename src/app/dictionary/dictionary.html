@if (error()) {
  <p class="dictionary dictionary--error" role="alert">{{ error() }}</p>
} @else if (isLoading()) {
  <p class="dictionary dictionary--loading" role="status">Loading...</p>
} @else {
  <div class="container">
    <app-filter-words [form]="searchWords" [categories]="categories()"/>
    <p>To study: {{toStudy()}}</p>
    <app-words-table [words]="words()"/>
  </div>
}
