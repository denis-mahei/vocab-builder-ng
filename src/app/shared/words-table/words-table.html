<div class="wrapper">
  <table class="table">
    <caption class="visually-hidden">
      Words table
    </caption>
    <thead>
    <tr>
      <th scope="col" class="table__th table__th--words">
        <span class="table__flag"
        >Words
          <svg class="table__flag-icon" aria-hidden="true">
            <use href="/icons/sprite.svg#flag-uk"></use>
          </svg>
        </span>
      </th>
      <th scope="col" class="table__th table__th--translation">
        <span class="table__flag">
          Translation
          <svg class="table__flag-icon" aria-hidden="true">
            <use href="/icons/sprite.svg#flag-ua"></use>
          </svg>
        </span>
      </th>
      <th class="table__th table__th--category" scope="col">Category</th>
      <th class="table__th table__th--progress" scope="col">Progress</th>
      <th class="table__th" scope="col"><span class="visually-hidden">actions</span></th>
    </tr>
    </thead>
    <tbody>
      @for (word of words(); track word._id) {
        <tr>
          <td lang="en">{{ word.en }}</td>
          <td lang="uk">{{ word.ua }}</td>
          <td class="table__th--category">{{ word.category }}</td>
          <td>{{ word.progress }}%</td>
          <td class="table__actions">
            <button type="button" class="table__btn" aria-label="Actions for {{word.en}}">...</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5">No words yet!</td>
        </tr>
      }
    </tbody>
  </table>
</div>
