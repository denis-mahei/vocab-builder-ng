<button
  type="button"
  (click)="closeModal()"
  class="add-word-modal__close"
  aria-label="Close modal"
>
  <svg width="24" height="24" aria-hidden="true">
    <use href="/icons/sprite.svg#close"></use>
  </svg>
</button>
<h2 id="add-word-dialog-title" class="add-word-modal__title">Add word</h2>
<p class="add-word-modal__text">
  Adding a new word to the dictionary is an important step in enriching the
  language base and expanding the vocabulary.
</p>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <app-category-picker
    [form]="form"
    [categories]="data.categories"
    variant="inverse"
  />
  @if (showHint) {
    <p class="add-word-modal__hint">Such data must be entered in the format I form-II form-III form.</p>
  }
  <app-word-fields [form]="form" class="add-word-modal__word-fields"/>
  <div class="add-word-modal__buttons">
    <button type="submit" class="btn btn--primary-inverse">Add</button>
    <button type="button" class="btn btn--secondary-inverse" (click)="closeModal()">Cancel</button>
  </div>
</form>
