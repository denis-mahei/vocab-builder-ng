<header class="header">
  <div class="container">
    <div class="logo">
      <div class="logo__icon">
        <svg width="27" height="27" aria-hidden="true">
          <use href="/icons/sprite.svg#logo"></use>
        </svg>
      </div>
      <p class="logo__text">VocabBuilder</p>
    </div>
  </div>
</header>
<main>
  <div class="container auth-content">
    <div class="card">
      <router-outlet />
    </div>
    <figure class="img-container">
      <picture>
        <source
          media="(max-width: 767px)"
          srcset="
            /images/auth/illustration-mobile.webp,
            /images/auth/illustration-mobile@2x.webp 2x
          "
          width="247px"
          height="191px"
        />
        <img
          class="content-img"
          src="/images/auth/illustration.webp"
          alt=""
          srcset="
            /images/auth/illustration.webp,
            /images/auth/illustration@2x.webp 2x
          "
          loading="eager"
          width="498"
          height="435"
        />
      </picture>
      <figcaption class="text">
        Word · Translation · Grammar · Progress
      </figcaption>
    </figure>
  </div>
</main>
