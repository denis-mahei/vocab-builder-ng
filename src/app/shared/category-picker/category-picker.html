<div
  [formGroup]="form()"
  class="category-picker"
  [class.category-picker--row]="direction() === 'row'"
  [class.category-picker--inverse]="variant() === 'inverse'"
>
  <label [for]="categoryId" class="visually-hidden">Categories</label>
  <div class="category-picker__select-wrapper">
    <select
      [id]="categoryId"
      formControlName="category"
      class="input category-picker__select"
    >
      <option value="">Categories</option>
      @for (c of categories(); track c) {
        <option [value]="c">{{ c | titlecase }}</option>
      }
    </select>
    <svg
      width="20"
      height="20"
      aria-hidden="true"
      class="category-picker__icon category-picker__chevron"
    >
      <use href="/icons/sprite.svg#chevron"></use>
    </svg>
  </div>
  @if (isVerb) {
    <fieldset class="category-picker__radio-group">
      <legend class="visually-hidden">Verb type</legend>
      <label class="category-picker__radio-label">
        <input
          class="category-picker__radio"
          type="radio"
          formControlName="isIrregular"
          [value]="false"
        />
        Regular
      </label>
      <label class="category-picker__radio-label">
        <input
          class="category-picker__radio"
          type="radio"
          formControlName="isIrregular"
          [value]="true"
        />
        Irregular
      </label>
    </fieldset>
  }
</div>
