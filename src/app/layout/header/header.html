<header class="header">
  <div class="container header__inner">
    <div class="logo">
      <div class="logo__icon">
        <svg width="27" height="27" aria-hidden="true">
          <use href="/icons/sprite.svg#logo"></use>
        </svg>
      </div>
      <p class="logo__text">VocabBuilder</p>
    </div>
    <nav class="nav">
      <ul class="nav__list">
        <li>
          <a
            routerLink="/dictionary"
            routerLinkActive="nav__link--active"
            class="nav__link"
            >Dictionary</a
          >
        </li>
        <li>
          <a
            routerLink="/recommend"
            routerLinkActive="nav__link--active"
            class="nav__link"
            >Recommend</a
          >
        </li>
        <li>
          <a
            routerLink="/training"
            routerLinkActive="nav__link--active"
            class="nav__link"
            >Training</a
          >
        </li>
      </ul>
    </nav>
    <div class="user-bar">
      <p class="user-bar__name">{{ auth.user()?.name }}</p>
      <div class="user-bar__avatar">
        <svg width="24" height="24" aria-hidden="true">
          <use href="/icons/sprite.svg#user"></use>
        </svg>
      </div>
      <button type="button" class="user-bar__logout" (click)="logout()">
        Log out
        <svg width="20" height="20" aria-hidden="true">
          <use href="/icons/sprite.svg#arrow"></use>
        </svg>
      </button>
    </div>
  </div>
</header>
