<form [formGroup]="form()" class="filters">
  <label for="search" class="visually-hidden">Search word</label>
  <div class="filters__search-wrapper">
    <input
      type="search"
      id="search"
      class="input filters__input"
      formControlName="term"
      placeholder="Find the word"
    />
    <svg width="20" height="20" aria-hidden="true" class="filters__icon">
      <use href="/icons/sprite.svg#search"></use>
    </svg>
  </div>
  <app-category-picker [form]="form()" [categories]="categories()"/>
</form>
