<header class="header">
  <div class="container header__inner">
    <div class="logo">
      <div class="logo__icon">
        <svg width="27" height="27" aria-hidden="true">
          <use href="/icons/sprite.svg#logo"></use>
        </svg>
      </div>
      <p class="logo__text">VocabBuilder</p>
    </div>
    <app-user-nav class="header__nav" />
    <div class="header__user">
      <app-user-bar />
      <app-logout-button class="header__logout" />
      <button type="button" class="burger-btn" aria-label="Open menu" (click)="openDialog()" aria-haspopup="dialog">
        <svg width="32" height="32" aria-hidden="true">
            <use href="/icons/sprite.svg#nav"></use>
        </svg>
      </button>
    </div>
  </div>
</header>
